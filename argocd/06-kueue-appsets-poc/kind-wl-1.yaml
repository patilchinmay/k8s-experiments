---
# Workload cluster: Kueue controller + queues are deployed here by ArgoCD from the hub.
# The worker node is labelled karpenter.sh/nodepool=cpu-nodes by setup.sh so the
# "default" ResourceFlavor (nodeLabels) matches it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kueue-wl-1
nodes:
  - role: control-plane
  - role: worker
